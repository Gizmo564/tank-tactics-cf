<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tank Tactics Arena</title>
<meta name="theme-color" content="#faf3e6">
<meta name="description" content="Turn-based multiplayer tank battles — free to play in your browser.">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="/css/style.css">
<script>
  // Applied before first paint so there's no flash of the default theme.
  try { var t = localStorage.getItem('tt_theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {}
</script>
</head>
<body>
<div id="app"></div>
<div class="toast-wrap" id="toastWrap" aria-live="polite"></div>
<button id="themeToggleBtn" class="theme-toggle-btn" type="button" title="Settings" aria-label="Settings" aria-haspopup="true" aria-expanded="false" aria-controls="themePanel"></button>
<div id="themePanel" class="theme-panel" role="region" aria-label="Settings"></div>
<noscript><p style="text-align:center;margin-top:80px">Tank Tactics needs JavaScript.</p></noscript>
<script src="https://0801564.xyz/a.js" data-site="tanks" defer></script>
<script type="module" src="/js/main.js"></script>
</body>
</html>
